name: Release macOS recorder

on:
  push:
    tags:
      - "mac-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for the release candidate
        required: true
        default: "0.3.0"

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MANUAL_APP_VERSION: ${{ inputs.version }}
      MACOS_RELEASE_CERTIFICATE: ${{ secrets.MACOS_RELEASE_CERTIFICATE }}
      MACOS_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_RELEASE_CERTIFICATE_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Validate release tag and secrets
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            APP_VERSION="${RELEASE_TAG#mac-v}"
          else
            APP_VERSION="$MANUAL_APP_VERSION"
            RELEASE_TAG="mac-v${APP_VERSION}"
          fi
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH, for example 0.3.0." >&2
            exit 1
          fi

          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Missing GitHub Actions secret: SPARKLE_PRIVATE_KEY" >&2
            exit 1
          fi
          if [[ -z "$MACOS_RELEASE_CERTIFICATE" ]]; then
            echo "Missing GitHub Actions secret: MACOS_RELEASE_CERTIFICATE" >&2
            exit 1
          fi
          if [[ -z "$MACOS_RELEASE_CERTIFICATE_PASSWORD" ]]; then
            echo "Missing GitHub Actions secret: MACOS_RELEASE_CERTIFICATE_PASSWORD" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Import stable release certificate
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/tape-release.p12"
          CERTIFICATE_PEM_PATH="$RUNNER_TEMP/tape-release.pem"
          KEYCHAIN_PATH="$RUNNER_TEMP/tape-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_RELEASE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_RELEASE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security find-certificate \
            -p \
            -c "Tape Desktop Release" \
            "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM_PATH"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$CERTIFICATE_PEM_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          CODESIGN_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              awk '/"Tape Desktop Release"/ { print $2; exit }'
          )"
          if [[ -z "$CODESIGN_IDENTITY" ]]; then
            echo "Tape Desktop Release signing identity was not imported." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Test and build stable signed app
        working-directory: mac/LocalRecorder
        shell: bash
        env:
          BUILD_CONFIGURATION: release
        run: |
          set -euo pipefail
          npm ci --prefix Sidecar
          npm test --prefix Sidecar
          swift test
          script/build_and_run.sh --package

          APP_PATH="$PWD/dist/Tape Desktop.app"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Contents/Info.plist")" = "$APP_VERSION"
          test "$(plutil -extract CFBundleVersion raw "$APP_PATH/Contents/Info.plist")" = "$BUILD_VERSION"
          test "$(plutil -extract SUEnableAutomaticChecks raw "$APP_PATH/Contents/Info.plist")" = "true"
          test "$(plutil -extract SUAutomaticallyUpdate raw "$APP_PATH/Contents/Info.plist")" = "true"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/MeetingNoteLocalRecorder")" = "arm64"

          APP_SIGNATURE="$(codesign -dvv "$APP_PATH" 2>&1)"
          if grep -q "Signature=adhoc" <<<"$APP_SIGNATURE"; then
            echo "The release app must not use an ad hoc signature." >&2
            exit 1
          fi
          if ! grep -q "Authority=Tape Desktop Release" <<<"$APP_SIGNATURE"; then
            echo "The release app does not use the stable Tape Desktop certificate." >&2
            exit 1
          fi
          while IFS= read -r -d '' target; do
            if /usr/bin/file "$target" | /usr/bin/grep -q "Mach-O"; then
              details="$(codesign -dvv "$target" 2>&1)"
              if ! grep -q "flags=.*runtime" <<<"$details"; then
                echo "Missing hardened runtime: $target" >&2
                exit 1
              fi
              if grep -q "Signature=adhoc" <<<"$details"; then
                echo "Unexpected ad hoc signature: $target" >&2
                exit 1
              fi
              if ! grep -q "Authority=Tape Desktop Release" <<<"$details"; then
                echo "Unexpected signing identity: $target" >&2
                exit 1
              fi
              codesign --verify --strict "$target"
            fi
          done < <(find "$APP_PATH" -type f -print0)

          NODE_ENTITLEMENTS="$(
            codesign -d --entitlements - "$APP_PATH/Contents/Resources/node/bin/node" 2>&1
          )"
          if grep -q "com.apple.security.get-task-allow" <<<"$NODE_ENTITLEMENTS"; then
            echo "The bundled Node runtime must not include get-task-allow." >&2
            exit 1
          fi

      - name: Build Sparkle feed and release assets
        id: release_assets
        working-directory: mac/LocalRecorder
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/dist/Tape Desktop.app"
          UPDATES_DIR="$PWD/dist/updates"
          ARCHIVE_NAME="Tape-Desktop-${APP_VERSION}.zip"
          ARCHIVE_PATH="$UPDATES_DIR/$ARCHIVE_NAME"
          SPARKLE_TOOLS="$PWD/.build/artifacts/sparkle/Sparkle/bin"

          mkdir -p "$UPDATES_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"
          shasum -a 256 "$ARCHIVE_PATH" > "$ARCHIVE_PATH.sha256"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$SPARKLE_TOOLS/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
              --maximum-deltas 0 \
              "$UPDATES_DIR"

          test -s "$UPDATES_DIR/appcast.xml"
          grep -q "sparkle:edSignature=" "$UPDATES_DIR/appcast.xml"
          grep -q "$ARCHIVE_NAME" "$UPDATES_DIR/appcast.xml"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=$ARCHIVE_PATH.sha256" >> "$GITHUB_ENV"
          echo "APPCAST_PATH=$UPDATES_DIR/appcast.xml" >> "$GITHUB_ENV"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$ARCHIVE_PATH.sha256" >> "$GITHUB_OUTPUT"
          echo "appcast_path=$UPDATES_DIR/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Tape-Desktop-${{ steps.release_metadata.outputs.app_version }}
          path: |
            ${{ steps.release_assets.outputs.archive_path }}
            ${{ steps.release_assets.outputs.checksum_path }}
            ${{ steps.release_assets.outputs.appcast_path }}
          if-no-files-found: error

      - name: Publish GitHub Release and update feed
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INSTALL_NOTES="$(cat <<'EOF'
          ## Install on macOS

          This build uses Tape's stable release certificate. It is not signed with an Apple Developer ID and is not notarized by Apple.

          1. Download and unzip the `Tape Desktop` ZIP.
          2. Drag `Tape Desktop.app` into `/Applications`.
          3. Open Terminal and run:

             `xattr -dr com.apple.quarantine "/Applications/Tape Desktop.app"`

          4. Open the app:

             `open "/Applications/Tape Desktop.app"`

          5. Grant Microphone, Screen Recording, Accessibility, and Notifications when prompted.

          Updating from 0.2.0 changes the app from an ad hoc identity to the stable release identity. Re-enable the four permissions once after this update. Later updates retain the same identity.
          EOF
          )"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$ARCHIVE_PATH" \
              "$CHECKSUM_PATH" \
              --generate-notes \
              --notes "$INSTALL_NOTES" \
              --latest \
              --title "Tape Desktop ${APP_VERSION}" \
              --verify-tag
          fi

          if gh release view macos-appcast >/dev/null 2>&1; then
            gh release upload macos-appcast "$APPCAST_PATH" --clobber
          else
            gh release create macos-appcast \
              "$APPCAST_PATH" \
              --prerelease \
              --title "macOS automatic update feed" \
              --notes "Machine managed Sparkle update feed."
          fi

          gh release view "$RELEASE_TAG" --json url,tagName,isDraft,isPrerelease
          gh release view macos-appcast --json url,tagName,isDraft,isPrerelease
